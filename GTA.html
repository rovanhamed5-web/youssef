    <!DOCTYPE html>
<html>

<head>

    <link rel="stylesheet" href="GTA.css">

    <title>GTA V</title>

</head>

<body>

    <div class="product-modal">

        <div class="product-popup">

            <button class="close" onclick="window.location.href='index.html'">×</button>

            <div class="product-image">
                <img src="https://tse3.mm.bing.net/th/id/OIP.0P6A52fIOYOJAfr5uKYxhAHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="GTA V">
            </div>

            <div class="product-info">

                <span class="stock">In Stock</span>

                <h1>GTA V</h1>

                <div class="rating">
                    ★★★★★
                    <span>5.0 (1309 reviews)</span>
                </div>

               <select id="accountType" onchange="updateProductPrice()">
    <option value="full" data-price="1100">
        Full Account — 1,100 EGP
    </option>
    <option value="primary" data-price="900">
        Primary — 900 EGP
    </option>
    <option value="secondary" data-price="600">
        Secondary — 600 EGP
    </option>
</select>

<h2 id="productPrice">1,100 EGP</h2>

                <p>
                    Grand Theft Auto V is an open-world, action-adventure
                    game set in the fictional state of San Andreas and
                    the city of Los Santos.
                </p>

                <!-- <div class="quantity">
                    <button>−</button>
                    <span>1</span>
                    <button>+</button>
                </div> -->
                <div class="quantity">
    <button type="button" onclick="decreaseQuantity()">−</button>
    <span>1</span>
    <button type="button" onclick="increaseQuantity()">+</button>
</div>

                <button class="cart">🛒 Add to Cart</button>

                <button class="wishlist">♡ Add to Wishlist</button>

            </div>

        </div>

    </div>
<script src="finalproject.js" defer></script>
</body>

</html>
